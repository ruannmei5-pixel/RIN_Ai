<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>RIN — Responsive Intelligent Navigator</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Visually hidden live region for screen-reader announcements
       (typing/done/stopped/error/new chat) without re-reading the
       whole streaming message on every chunk. -->
  <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>

  <div class="app-shell">
    <div class="app">

      <!-- HEADER -->
      <header class="header">
        <div class="header-left">
          <div class="logo" id="logoAvatar">R</div>
          <div class="header-text">
            <div class="header-title-row">
              <span class="header-title">RIN</span>
              <span
                class="memory-badge"
                id="memoryBadge"
                title="Memori percakapan RIN disimpan di SQLite lokal server. Indikator ini statis, bukan hasil pengecekan langsung ke server."
              >🧠 Memory aktif</span>
            </div>
            <div class="header-subtitle">Responsive Intelligent Navigator</div>
          </div>
        </div>
        <div class="header-right">
          <button
            type="button"
            id="systemPanelButton"
            class="icon-button"
            aria-label="Info sistem & file workspace"
            title="System &amp; Files"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="3" y="4" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M3 9h18" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
          <button
            type="button"
            id="voiceToggleButton"
            class="icon-button voice-toggle"
            aria-label="Voice otomatis: mati"
            aria-pressed="false"
            title="Voice: OFF (jawaban RIN tidak dibacakan otomatis)"
          >🔇</button>
          <button
            type="button"
            id="newChatButton"
            class="icon-button"
            aria-label="Mulai chat baru"
            title="Chat baru"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusLabel" role="status" aria-live="polite">Menghubungkan...</span>
        </div>
      </header>

      <!-- CHAT AREA -->
      <main class="chat-area" id="chatArea">

        <!-- WELCOME SCREEN -->
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-logo">R</div>
          <h1 class="welcome-title">RIN</h1>
          <p class="welcome-subtitle">Responsive Intelligent Navigator</p>
          <p class="welcome-desc">Teman AI pribadi yang siap membantu.</p>

          <div class="quick-actions" id="quickActions">
            <button class="quick-action" data-prompt="Halo RIN, kenalkan dirimu.">👋 Sapa RIN</button>
            <button class="quick-action" data-prompt="Apa yang bisa kamu lakukan?">✨ Apa yang bisa kamu lakukan?</button>
            <button class="quick-action" data-prompt="Bantu aku menyelesaikan masalah coding.">💻 Bantu saya coding</button>
            <button class="quick-action" data-prompt="Jelaskan sebuah topik yang aku pilih.">📚 Jelaskan sesuatu</button>
          </div>
        </div>

        <!-- MESSAGES -->
        <div class="messages" id="messages"></div>

      </main>

      <!-- INPUT AREA -->
      <footer class="input-area">
        <!-- Transient voice status: "listening", "speaking", or a
             short error toast. Hidden by default; toggled from JS. -->
        <div class="voice-status-bar" id="voiceStatusBar" hidden>
          <span class="voice-status-text" id="voiceStatusText"></span>
          <button type="button" id="voiceStatusStopBtn" class="voice-status-stop" hidden>Stop</button>
        </div>

        <form id="chatForm" class="chat-form">
          <button
            type="button"
            id="micButton"
            class="mic-button"
            aria-label="Mulai input suara"
            title="Input suara"
          >🎙️</button>
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Tulis pesan untuk RIN..."
            aria-label="Tulis pesan untuk RIN"
            rows="1"
            autocomplete="off"
          ></textarea>
          <button type="submit" id="sendButton" class="send-button" disabled aria-label="Kirim pesan">
            <svg class="icon-send" viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/>
            </svg>
          </button>
        </form>
      </footer>

    </div>

    <!-- SYSTEM & FILES PANEL (PHASE 7) -->
    <div class="side-panel-overlay" id="sidePanelOverlay" hidden></div>
    <aside class="side-panel" id="sidePanel" aria-hidden="true" aria-label="Info sistem dan file workspace">
      <div class="side-panel-header">
        <span class="side-panel-title">RIN</span>
        <button type="button" id="sidePanelClose" class="icon-button" aria-label="Tutup panel">✕</button>
      </div>

      <div class="side-panel-tabs">
        <button type="button" class="side-panel-tab active" data-tab="system">System</button>
        <button type="button" class="side-panel-tab" data-tab="files">Files</button>
      </div>

      <div class="side-panel-body">
        <section class="panel-section active" id="panelSystem">
          <div class="panel-status" id="systemInfoStatus">Memuat informasi sistem...</div>
          <dl class="info-grid" id="systemInfoGrid" hidden></dl>
        </section>

        <section class="panel-section" id="panelFiles">
          <div class="panel-status" id="filesStatus">Memuat daftar file...</div>
          <p class="panel-hint">workspace/</p>
          <ul class="file-tree" id="fileTree" hidden></ul>
          <div class="file-preview" id="filePreview" hidden>
            <div class="file-preview-header">
              <span id="filePreviewName"></span>
              <button type="button" id="filePreviewClose" class="icon-button" aria-label="Tutup preview">✕</button>
            </div>
            <pre class="file-preview-content" id="filePreviewContent"></pre>
          </div>
        </section>
      </div>
    </aside>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
